server {
    listen              443 ssl http2;
    server_name         {{ server_dns }};

    ssl_certificate     {{ certificate_path }};
    ssl_certificate_key {{ privatekey_path }};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip                on;
    gzip_min_length     256;
    gzip_types          text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml image/svg+xml;

    location / {
        root /opt/{{ app_name }}/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            root /opt/{{ app_name }}/frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
}

server {
    listen              80;
    server_name         {{ server_dns }};
    return              301 https://$host$request_uri;
}
